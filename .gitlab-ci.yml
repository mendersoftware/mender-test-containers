.build:mender-dist-packages-image:
  tags:
    - k8s
  stage: build
  needs: []
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:git
  services:
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:${DOCKER_VERSION}-dind
      alias: docker
  before_script:
    - *requires-docker
    - *dind-login
  script:
    - apk add bash
    - CONTAINER_TAG=mender-dist-packages-builder-${BUILD}-${DISTRO}-${RELEASE}-${ARCH}
    - echo "INFO - Building and Pushing ${CONTAINER_TAG}-${CI_PIPELINE_ID} to the registry ${CI_REGISTRY_IMAGE}"
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - if [ "${ARCH}" != "amd64" ]; then docker run --rm --privileged tonistiigi/binfmt --install all; fi
    - cd mender-dist-packages-building
    - ./build.sh
         --container-tag ${CI_REGISTRY_IMAGE}:${CONTAINER_TAG}
         --distro ${DISTRO}
         --release ${RELEASE}
         --arch ${ARCH}
         --ci-pipeline-id ${CI_PIPELINE_ID}
    # New naming scheme (separate image repository)
    - docker tag ${CI_REGISTRY_IMAGE}:${CONTAINER_TAG}-${CI_PIPELINE_ID} ${CI_REGISTRY_IMAGE}/mender-dist-packages-builder:${BUILD}-${DISTRO}-${RELEASE}-${ARCH}-${CI_PIPELINE_ID}
    - docker push ${CI_REGISTRY_IMAGE}/mender-dist-packages-builder:${BUILD}-${DISTRO}-${RELEASE}-${ARCH}-${CI_PIPELINE_ID}
  parallel: !reference [.mender-dist-packages-image-matrix, parallel]

build:mender-dist-packages-image:
  rules:
    - !reference [.rules, default]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - mender-dist-packages-building/**/*
  extends: .build:mender-dist-packages-image

build:mender-dist-packages-image:manual:
  when: manual
  extends: .build:mender-dist-packages-image

