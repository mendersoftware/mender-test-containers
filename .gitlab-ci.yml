image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:git

variables:
  DOCKER_BUILDKIT: 1
  DOCKER_VERSION:
    value: "29.7"
    description: "Version of docker to use in pipelines"
  DOCKER_HOST:
    value: 'tcp://docker:2376'
    description: "Required to run dind inside k8s runners with TLS"
  DOCKER_TLS_CERTDIR:
    value: '/certs'
    description: "The cert dir inside the gitlab runner. Don't change this."
  DOCKER_TLS_VERIFY:
    value: 1
    description: "Enable TLS verification for docker in dind"
  DOCKER_CERT_PATH:
    value: "$DOCKER_TLS_CERTDIR/client"
    description: "Used for docker entrypoints. See https://gitlab.com/gitlab-org/gitlab-runner/-/issues/4125"

.mender-dist-packages-image-matrix:
  parallel:
    matrix:
      - BUILD: crosscompile
        DISTRO: debian
        RELEASE: [bookworm, trixie]
        ARCH: [amd64, armhf, arm64]
      - BUILD: crosscompile
        DISTRO: ubuntu
        RELEASE: [noble, resolute]
        ARCH: [amd64, armhf, arm64]

.tag_n_push_to_gitlab_registry: &tag_n_push_to_gitlab_registry
  - docker pull ${CI_REGISTRY_IMAGE}:${CONTAINER_TAG}-${CI_PIPELINE_ID}
  - docker tag ${CI_REGISTRY_IMAGE}:${CONTAINER_TAG}-${CI_PIPELINE_ID} ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${IMAGE_TAG}
  - docker push ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${IMAGE_TAG}

include:
  - project: Northern.tech/Mender/mendertesting
    file:
      - qa-common/runner.yml
      - qa-common/retry.yml
  - component: gitlab.com/Northern.tech/Mender/mendertesting/commit-lint@master
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-github-status-updates.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-python3-format.yml'
  - component: gitlab.com/Northern.tech/Mender/mendertesting/renovate@master
    inputs:
      stage: ".pre"

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true
  tags: !reference [.qa-common-default-runner, tags]
  retry: !reference [.qa-common-default-retry, retry]

.requires-docker: &requires-docker
  - DOCKER_RETRY_SLEEP_S=10 # wait longer for k8s workers
  - DOCKER_RUNNING=false
  - for try in 4 3 2 1; do
  -   docker ps && DOCKER_RUNNING=true
  -   if [ "${DOCKER_RUNNING}" == "true" ]; then
  -     echo "DEBUG - docker is running - continue"
  -     break
  -   fi
  -   sleep "${DOCKER_RETRY_SLEEP_S}"
  - done
  - if [ "${DOCKER_RUNNING}" != "true" ]; then
  -   echo "DEBUG - docker is not running - exiting"
  -   exit 192
  - fi

.dind-login: &dind-login
  - mkdir -p "$HOME/.docker"
  - (umask 077; printf '%s' "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json")

.rules:
  default:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $REBUILD_ALL == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

stages:
  - build
  - test
  - publish

build:gui-e2e-testing:
  stage: build
  needs: []
  rules:
    - !reference [.rules, default]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - gui-e2e-testing/**/*
    - when: manual
      allow_failure: true
  variables:
    CONTAINER_TAG: "gui-e2e-testing"
    IMAGE_NAME: "gui-e2e-testing"
  services:
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:${DOCKER_VERSION}-dind
      alias: docker
  before_script:
    - *requires-docker
    - *dind-login
  script:
    - echo "INFO - Building and Pushing ${CONTAINER_TAG} to the registry ${CI_REGISTRY_IMAGE}"
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker build
        --cache-from ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:master
        -t ${CI_REGISTRY_IMAGE}:${CONTAINER_TAG}-${CI_PIPELINE_ID}
        -t ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${CI_PIPELINE_ID}
        -f gui-e2e-testing/Dockerfile
        --push
        gui-e2e-testing

